<!doctype html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <!-- Favicon. Keep these URLs EXACTLY as they are, for good. Google only
       shows a site's icon in search results once its favicon crawler has
       fetched it, and it is slow to come back: every time the URL changed
       (it did about seven times in 2026, ending at ?v=3) the wait started
       again. To change the logo, replace public/favicon.ico and
       public/favicon.png in place and leave these lines alone.
       /favicon.ico is Google's documented form (16-64px, including the
       48px it asks for); the PNG is the sharp one for browsers and phones. -->
  <link rel="icon" href="/favicon.ico" sizes="48x48" />
  <link rel="icon" href="/favicon.png?v=3" type="image/png" sizes="192x192" />
  <link rel="apple-touch-icon" href="/favicon.png?v=3" />
  <meta name="theme-color" content="#7c3aed" />

  <!-- The signed-in pages are dark (AppShell adds .theme-dark once its code
       has loaded). Paint them dark from the first frame so they never flash
       light; routes/__root.tsx removes this once the page has rendered. -->
  <style>.theme-boot, .theme-boot body { background: #13110f; }</style>
  <script>
    if (/^\/(dashboard|practice|community(\/|$)|profile|feedback|wellness|study-abroad|programmes|career-module|mentor-portal|login|signup|forgot-password|reset-password)/.test(location.pathname))
      document.documentElement.classList.add('theme-boot')
  </script>

  <!-- Defaults. scripts/generate-seo.mjs replaces title + description per page
       at build time, and src/lib/seo.ts keeps them correct during client-side
       navigation. -->
  <title>MySkills — Personal &amp; Professional Development, Powered by AI</title>
  <meta name="description"
    content="Build job-ready professional and personal skills with AI practice, mentor reviews and real internships. Start with a free initial assessment." />
  <link rel="canonical" href="https://myskills.org.in/" />
  <meta name="robots" content="index, follow, max-image-preview:large" />

  <meta property="og:site_name" content="MySkills" />
  <meta property="og:type" content="website" />
  <meta property="og:locale" content="en_IN" />
  <meta property="og:title" content="MySkills — Personal &amp; Professional Development, Powered by AI" />
  <meta property="og:description"
    content="Build job-ready professional and personal skills with AI practice, mentor reviews and real internships. Start with a free initial assessment." />
  <meta property="og:url" content="https://myskills.org.in/" />
  <meta property="og:image" content="https://myskills.org.in/og-image.png" />
  <meta property="og:image:width" content="1200" />
  <meta property="og:image:height" content="630" />

  <meta name="twitter:card" content="summary_large_image" />
  <meta name="twitter:title" content="MySkills — Personal &amp; Professional Development, Powered by AI" />
  <meta name="twitter:description"
    content="Build job-ready professional and personal skills with AI practice, mentor reviews and real internships. Start with a free initial assessment." />
  <meta name="twitter:image" content="https://myskills.org.in/og-image.png" />

  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <!-- Fonts load without holding up the page: a normal stylesheet link blocks
       both the first paint and the app's start until Google answers. This one
       is fetched as "print" (which doesn't block) and switched on when it
       arrives; text shows in the system font until then (display=swap). -->
  <link rel="preload" as="style" href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@500;600;700;800&family=JetBrains+Mono:wght@400;600&family=Inter:wght@400;500;600;700&family=Caveat:wght@500&display=swap" />
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@500;600;700;800&family=JetBrains+Mono:wght@400;600&family=Inter:wght@400;500;600;700&family=Caveat:wght@500&display=swap" rel="stylesheet" media="print" onload="this.media='all'" />
  <noscript><link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@500;600;700;800&family=JetBrains+Mono:wght@400;600&family=Inter:wght@400;500;600;700&family=Caveat:wght@500&display=swap" rel="stylesheet" /></noscript>
</head>

<body>
  <div id="root"></div>
  <script type="module" src="/src/main.tsx"></script>
</body>

</html>
