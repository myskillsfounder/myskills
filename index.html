<!doctype html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <!-- Favicon. The ?v= query busts browsers' (very sticky, separate from
       normal disk cache) favicon cache -- bump it whenever this file
       changes, since public/.htaccess deliberately caches root-level PNGs
       only briefly now but that fix only helps clients who haven't already
       cached the old one under the un-versioned URL. -->
 <link rel="icon" href="/favicon.png?v=3" type="image/png" sizes="192x192">
<link rel="apple-touch-icon" href="/favicon.png?v=3">
  <meta name="theme-color" content="#7c3aed" />

  <!-- Defaults. scripts/generate-seo.mjs replaces title + description per page
       at build time, and src/lib/seo.ts keeps them correct during client-side
       navigation. -->
  <title>MySkills — Personal &amp; Professional Development, Powered by AI</title>
  <meta name="description"
    content="Build job-ready professional and personal skills with AI practice, mentor reviews and real internships. Start with a free initial assessment." />
  <link rel="canonical" href="https://myskills.org.in/" />
  <meta name="robots" content="index, follow, max-image-preview:large" />

  <meta property="og:site_name" content="MySkills" />
  <meta property="og:type" content="website" />
  <meta property="og:locale" content="en_IN" />
  <meta property="og:title" content="MySkills — Personal &amp; Professional Development, Powered by AI" />
  <meta property="og:description"
    content="Build job-ready professional and personal skills with AI practice, mentor reviews and real internships. Start with a free initial assessment." />
  <meta property="og:url" content="https://myskills.org.in/" />
  <meta property="og:image" content="https://myskills.org.in/og-image.png" />
  <meta property="og:image:width" content="1200" />
  <meta property="og:image:height" content="630" />

  <meta name="twitter:card" content="summary_large_image" />
  <meta name="twitter:title" content="MySkills — Personal &amp; Professional Development, Powered by AI" />
  <meta name="twitter:description"
    content="Build job-ready professional and personal skills with AI practice, mentor reviews and real internships. Start with a free initial assessment." />
  <meta name="twitter:image" content="https://myskills.org.in/og-image.png" />

  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Space+Mono:wght@400;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
</head>

<body>
  <div id="root"></div>
  <script type="module" src="/src/main.tsx"></script>
</body>

</html>
